<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Clients · Admin</title>
    <script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-bs-theme',t);})();</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
</head>
<body class="antialiased">

<aside th:replace="~{admin/fragments :: sidebar('clients')}"></aside>

<div class="page-wrapper">
    <div class="page-header d-print-none">
        <div class="container-xl">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <h2 class="page-title">OAuth Clients</h2>
                </div>
                <div class="col-auto">
                    <a href="/admin/clients/new" class="btn btn-primary">
                        <i class="ti ti-plus me-1"></i> New Client
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="container-xl">

            <div th:if="${success}" class="alert alert-success alert-dismissible mb-3" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible mb-3" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-vcenter card-table">
                        <thead>
                            <tr>
                                <th>Client ID</th>
                                <th>Scopes</th>
                                <th>Redirect URI</th>
                                <th>Post-logout URI</th>
                                <th>Registered</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clients}">
                                <td><code class="fw-medium" th:text="${c.client_id}"></code></td>
                                <td class="text-muted small" th:text="${c.scopes}"></td>
                                <td class="text-muted small text-truncate" style="max-width:220px;"
                                    th:text="${c.redirect_uris}" th:title="${c.redirect_uris}"></td>
                                <td class="text-muted small text-truncate" style="max-width:180px;"
                                    th:text="${c.post_logout_redirect_uris}" th:title="${c.post_logout_redirect_uris}"></td>
                                <td class="text-muted small"
                                    th:text="${c.client_id_issued_at != null ? c.client_id_issued_at.toString().substring(0,10) : '—'}"></td>
                                <td class="text-end">
                                    <a th:href="@{/admin/clients/{id}/edit(id=${c.id})}"
                                       class="btn btn-sm btn-ghost-secondary me-1">
                                        <i class="ti ti-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/clients/{id}/delete(id=${c.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Delete client ' + this.dataset.clientId + '?')"
                                          th:data-client-id="${c.client_id}">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-ghost-danger">
                                            <i class="ti ti-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clients)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No OAuth clients registered. <a href="/admin/clients/new">Add one.</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta21/dist/js/tabler.min.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
