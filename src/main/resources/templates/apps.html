<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps · nthNode</title>
    <script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-bs-theme',t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/nav :: navbar}"></nav>

<main class="container" style="padding-top: 80px; padding-bottom: 80px; min-height: calc(100vh - 57px);">

    <div class="mb-5">
        <h4 class="fw-semibold mb-1">Apps</h4>
        <p class="text-muted small mb-0">Your nthNode tools and services.</p>
    </div>

    <!-- App cards -->
    <div th:if="${!apps.isEmpty()}" class="row g-4">
        <div th:each="app : ${apps}" class="col-sm-6 col-lg-4">
            <a th:href="${app.launchUrl}" target="_blank" rel="noopener" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm"
                     style="transition: transform 0.15s, box-shadow 0.15s; cursor: pointer;"
                     onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 24px rgba(0,0,0,.12)'"
                     onmouseout="this.style.transform='';this.style.boxShadow=''">
                    <div class="card-body p-4 d-flex flex-column gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <span class="material-icons" style="font-size:2rem;color:#1a73e8;" th:text="${app.icon}">apps</span>
                            <h6 class="mb-0 fw-semibold" th:text="${app.displayName}">App</h6>
                        </div>
                        <p class="mb-0 small text-muted" th:if="${app.description}" th:text="${app.description}"></p>
                        <div class="mt-auto d-flex align-items-center gap-1 small" style="color:#1a73e8;">
                            <span>Open</span>
                            <span class="material-icons" style="font-size:14px;">open_in_new</span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${apps.isEmpty()}" class="d-flex justify-content-center" style="padding-top: 40px;">
        <div class="card text-center border-0 shadow-sm" style="width:400px;">
            <div class="card-body p-5">
                <span class="material-icons mb-3 d-block text-muted" style="font-size:3rem;">apps</span>
                <h6 class="fw-semibold mb-1">No Apps Yet</h6>
                <p class="text-muted small mb-0">Apps you're given access to will appear here.</p>
            </div>
        </div>
    </div>

</main>

<script src="/js/theme.js"></script>
</body>
</html>
